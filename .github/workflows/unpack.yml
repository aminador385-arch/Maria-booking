name: unpack
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unzip and commit
        run: |
          unzip -oq maria-deploy.zip -d _t
          cp -R _t/server _t/book .
          cp _t/render.yaml .
          rm -rf _t maria-deploy.zip
          git config user.name "maria-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "unpack maria platform"
          git push
